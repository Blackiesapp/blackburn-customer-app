<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Blackburn Leisure</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Blackburn Leisure">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.neon-purple{color:#B026FF;text-shadow:0 0 10px #B026FF,0 0 20px #B026FF;font-weight:900;letter-spacing:1px}
.header{padding:18px 0 8px;text-align:center}
.logo-img{width:110px;height:110px;border-radius:24px;box-shadow:0 0 18px rgba(212,175,55,0.4);border:1px solid #222}
.subtitle{margin-top:14px;font-size:15px}
.carousel-wrap{margin-top:18px;overflow:hidden;position:relative}
.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.poster-card{min-width:240px;width:240px;height:320px;scroll-snap-align:center;border-radius:18px;border:2px solid #B026FF;box-shadow:0 0 18px rgba(176,38,255,0.6);overflow:hidden;position:relative;background:#111;flex-shrink:0;cursor:pointer}
.poster-card img{width:100%;height:100%;object-fit:cover}
.poster-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.95));padding:36px 12px 10px}
.poster-title{font-size:13px;font-weight:800}
.details-btn{position:absolute;top:10px;right:10px;background:#B026FF;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;box-shadow:0 0 10px #B026FF}
.grid{padding:18px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{height:148px;background:#0a0a0a;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:transform 0.15s}
.box:active{transform:scale(0.97)}
.box.active{border:2px solid #B026FF;box-shadow:0 0 16px rgba(176,38,255,0.5), inset 0 0 10px rgba(176,38,255,0.1)}
.box.inactive{border:2px solid #333;opacity:0.7}
.box-icon{font-size:38px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 0 8px currentColor)}
.box.active .box-icon{color:#B026FF}
.box.inactive .box-icon{color:#666}
.box-label{font-size:12px;font-weight:800;letter-spacing:0.5px;text-align:center;color:#fff}
.soon-badge{position:absolute;top:8px;right:8px;background:#222;color:#888;font-size:8px;padding:3px 7px;border-radius:10px;font-weight:800}
.footer{text-align:center;padding:22px 14px 30px;color:#888;font-size:11px;line-height:1.6;border-top:1px solid #111;margin-top:10px}
.install-banner{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid #B026FF;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100;transform:translateY(100%);transition:transform 0.3s}
.install-banner.show{transform:translateY(0)}
.install-banner button{background:#B026FF;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:800;font-size:13px}
.detail-overlay{position:fixed;inset:0;background:#000;z-index:200;overflow-y:auto;display:none;padding-bottom:40px}
.detail-overlay.open{display:block}
.home-btn{position:sticky;top:0;z-index:5;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #222}
.home-btn button{background:#222;color:#fff;border:1px solid #444;padding:8px 16px;border-radius:20px;font-weight:700}
.detail-poster{width:100%;max-width:420px;margin:16px auto;display:block;border-radius:16px;border:2px solid #B026FF;box-shadow:0 0 20px rgba(176,38,255,0.5)}
.detail-meta{padding:16px;text-align:center}
.detail-meta h2{font-size:20px;margin-bottom:8px}
.detail-meta p{color:#aaa;font-size:14px;line-height:1.5}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dot{width:6px;height:6px;border-radius:50%;background:#333}
.dot.active{background:#B026FF;box-shadow:0 0 6px #B026FF}
.list-overlay{position:fixed;inset:0;background:#000;z-index:150;overflow-y:auto;display:none}
.list-overlay.open{display:block}
.list-item{display:flex;gap:12px;padding:14px;border-bottom:1px solid #111;align-items:center}
.list-item img{width:60px;height:80px;border-radius:8px;object-fit:cover;border:1px solid #B026FF}
</style>
</head>

<script>
const events=[
{id:1,title:"Queen Tribute Live",date:"2026-11-14",time:"Doors 7pm Show 8pm",desc:"Bohemian Night - Tickets £18 - The ultimate Queen experience",poster:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1080&h=1350&fit=crop"},
{id:2,title:"80s Night Extravaganza",date:"2026-11-22",time:"Doors 7:30pm",desc:"Live band + DJ till late - Fancy dress encouraged",poster:"https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1080&h=1350&fit=crop"},
{id:3,title:"ABBA Magic",date:"2026-12-05",time:"Doors 7pm Show 8:30pm",desc:"Dancing Queen - All the hits live",poster:"https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=1080&h=1350&fit=crop"},
{id:4,title:"Soul & Motown",date:"2026-12-12",time:"Doors 8pm",desc:"Live 10-piece band - Tickets £15",poster:"https://images.unsplash.com/photo-1459749411175-04bf52978dd5?w=1080&h=1350&fit=crop"},
{id:5,title:"Christmas Party Night",date:"2026-12-19",time:"7pm till 1am",desc:"3 course meal + live entertainment + disco",poster:"https://images.unsplash.com/photo-1513151233558-d860c5398176?w=1080&h=1350&fit=crop"}
];
const buttons=[
{label:"ALL UPCOMING EVENTS",icon:"📅",active:true,action:"list"},
{label:"TROPHY EVENTS",icon:"🏆",active:false},
{label:"GROUP ACTIVITIES",icon:"👥",active:false},
{label:"VENUE HIRE",icon:"🏢",active:false},
{label:"OPENING TIMES",icon:"🕐",active:false},
{label:"CONTACT US",icon:"📞",active:false}
];

const carousel=document.getElementById('carousel');
const dots=document.getElementById('dots');

function renderCarousel(){
carousel.innerHTML='';dots.innerHTML='';
events.filter(e=>new Date(e.date)>=new Date(new Date().setHours(0,0,0,0))).forEach((ev,i)=>{
const card=document.createElement('div');card.className='poster-card';
card.innerHTML=`<img src="${ev.poster}" loading="lazy"><button class="details-btn">Details</button><div class="poster-info"><div class="poster-title">${ev.title}</div><div style="font-size:10px;color:#ccc;margin-top:2px">${ev.date}</div></div>`;
card.onclick=()=>openDetail(ev);carousel.appendChild(card);
const dot=document.createElement('div');dot.className='dot'+(i===0?' active':'');dots.appendChild(dot);
});
}
let autoIndex=0;
function autoScroll(){
const filtered=events.filter(e=>new Date(e.date)>=new Date(new Date().setHours(0,0,0,0)));
if(filtered.length===0)return;
autoIndex=(autoIndex+1)%filtered.length;
const cardWidth=254;
carousel.scrollTo({left:autoIndex*cardWidth,behavior:'smooth'});
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===autoIndex));
}
let interval=setInterval(autoScroll,4000);
carousel.addEventListener('touchstart',()=>clearInterval(interval));
carousel.addEventListener('touchend',()=>interval=setInterval(autoScroll,4000));
carousel.addEventListener('scroll',()=>{
const idx=Math.round(carousel.scrollLeft/254);
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
});

function renderGrid(){
const grid=document.getElementById('grid');grid.innerHTML='';
buttons.forEach(b=>{
const div=document.createElement('div');div.className='box '+(b.active?'active':'inactive');
div.innerHTML=`<div class="box-icon">${b.icon}</div><div class="box-label">${b.label}</div>${!b.active?'<div class="soon-badge">SOON</div>':''}`;
div.onclick=()=>{if(b.action==='list')openList();else if(!b.active)alert(b.label+' - Coming Soon');};
grid.appendChild(div);
});
}

function openDetail(ev){
document.getElementById('detailPoster').src=ev.poster;
document.getElementById('detailTitle').textContent=ev.title;
document.getElementById('detailDate').textContent='📅 '+ev.date;
document.getElementById('detailTime').textContent='🕐 '+ev.time;
document.getElementById('detailDesc').textContent=ev.desc;
document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('open');}
function openList(){
const filtered=events.filter(e=>new Date(e.date)>=new Date(new Date().setHours(0,0,0,0))).sort((a,b)=>new Date(a.date)-new Date(b.date));
const cont=document.getElementById('listContent');cont.innerHTML='';
filtered.forEach(ev=>{
const row=document.createElement('div');row.className='list-item';
row.innerHTML=`<img src="${ev.poster}"><div style="flex:1"><div style="font-weight:800;font-size:14px">${ev.title}</div><div style="font-size:11px;color:#aaa">${ev.date} • ${ev.time}</div></div><button style="background:#B026FF;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800">Details</button>`;
row.onclick=()=>{closeList();openDetail(ev);};cont.appendChild(row);
});
document.getElementById('listOverlay').classList.add('open');
}
function closeList(){document.getElementById('listOverlay').classList.remove('open');}

let deferredPrompt;
const banner=document.getElementById('installBanner');
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;banner.classList.add('show');});
installBtn.addEventListener('click',async()=>{
if(deferredPrompt){deferredPrompt.prompt();const {outcome}=await deferredPrompt.userChoice;deferredPrompt=null;banner.classList.remove('show');}
else{alert('To install: Tap Share → Add to Home Screen');}
});
setTimeout(()=>{
if(window.navigator.standalone===false || !window.matchMedia('(display-mode: standalone)').matches){
if(!deferredPrompt)banner.classList.add('show');
}
},2000);

renderCarousel();renderGrid();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
